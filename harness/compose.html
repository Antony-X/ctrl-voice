<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>harness compositor</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #bg, #wall, #fg { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="wall"></canvas>
<img id="fg" alt="" />
<script>
'use strict';
// Driven by the harness main process: window.compose({ backdrop, png }).
// backdrop: { kind: 'wallpaper', name } | { kind: 'image', url } | { kind: 'css', css }

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const WALLPAPERS = {
  'wallpaper-dark': {
    seed: 7,
    base: ['#070b1f', '#1b0d3d', '#03263a'],
    blobs: ['#ff2f7d', '#7a4dff', '#00c8ff', '#ff8a1f', '#12e0a0', '#2f5dff', '#ff4fd8'],
    blobAlpha: 0.9,
    petals: [['#4f7bff', '#b06bff'], ['#00d2ff', '#3a5bff'], ['#ff5fa2', '#8a4dff'], ['#ffb02e', '#ff4f6d'], ['#1fe3b0', '#2a8bff']],
    petalAlpha: 0.85,
    dots: ['#ffffff', '#ffe066', '#7cf7ff', '#ff9ad5'],
    stroke: 'rgba(255,255,255,0.55)',
  },
  'wallpaper-light': {
    seed: 11,
    base: ['#e8efff', '#fde6f1', '#e2fbf3'],
    blobs: ['#4d82ff', '#ff6fae', '#ffc845', '#25c9b5', '#9b7bff', '#ff8250', '#3fd06b'],
    blobAlpha: 0.75,
    petals: [['#3e6dff', '#8d6bff'], ['#00b4e6', '#2f7bff'], ['#ff4f8f', '#b05cff'], ['#ffa21f', '#ff5a5a'], ['#16c79a', '#3b8dff']],
    petalAlpha: 0.8,
    dots: ['#ffffff', '#1d2b6b', '#ff3d7f', '#0aa5a5'],
    stroke: 'rgba(255,255,255,0.8)',
  },
};

function drawWallpaper(canvas, name) {
  const P = WALLPAPERS[name];
  const W = canvas.width, H = canvas.height, M = Math.max(W, H);
  const ctx = canvas.getContext('2d');
  const rnd = mulberry32(P.seed);
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];

  // 1. diagonal base gradient
  const g = ctx.createLinearGradient(0, 0, W, H);
  P.base.forEach((c, i) => g.addColorStop(i / (P.base.length - 1), c));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 2. big soft colour blobs
  for (let i = 0; i < 11; i++) {
    const x = rnd() * W, y = rnd() * H, r = M * (0.18 + rnd() * 0.35);
    const c = P.blobs[i % P.blobs.length];
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, c);
    rg.addColorStop(1, c + '00');
    ctx.globalAlpha = P.blobAlpha;
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalAlpha = 1;

  // 3. Windows-11-style "bloom": sharp-edged gradient petals (edges make blur visible)
  const cx = W * (0.35 + rnd() * 0.3), cy = H * (0.45 + rnd() * 0.2);
  const len = M * 0.42, wid = M * 0.11;
  const n = 7;
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI * 0.95 + (i / (n - 1)) * Math.PI * 1.9 + (rnd() - 0.5) * 0.15;
    const [c1, c2] = P.petals[i % P.petals.length];
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    const lg = ctx.createLinearGradient(0, 0, len, 0);
    lg.addColorStop(0, c1);
    lg.addColorStop(1, c2);
    ctx.globalAlpha = P.petalAlpha;
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.ellipse(len * 0.5, 0, len * 0.5, wid, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.lineWidth = Math.max(1, M / 900);
    ctx.strokeStyle = P.stroke;
    ctx.stroke();
    ctx.restore();
  }

  // 4. crisp wavy ribbons across the whole width
  for (let k = 0; k < 3; k++) {
    const y0 = H * (0.2 + 0.3 * k + (rnd() - 0.5) * 0.1);
    const amp = H * (0.05 + rnd() * 0.08), freq = (1 + rnd() * 2) * Math.PI * 2 / W, th = H * (0.02 + rnd() * 0.03);
    const phase = rnd() * Math.PI * 2;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 4) ctx.lineTo(x, y0 + Math.sin(x * freq + phase) * amp);
    for (let x = W; x >= 0; x -= 4) ctx.lineTo(x, y0 + th + Math.sin(x * freq + phase + 0.4) * amp);
    ctx.closePath();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = pick(P.blobs);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 5. small crisp dots / rings (fine detail)
  for (let i = 0; i < 70; i++) {
    const x = rnd() * W, y = rnd() * H, r = M * (0.002 + rnd() * 0.01);
    ctx.globalAlpha = 0.5 + rnd() * 0.5;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    if (rnd() < 0.3) { ctx.lineWidth = Math.max(1, r * 0.35); ctx.strokeStyle = pick(P.dots); ctx.stroke(); }
    else { ctx.fillStyle = pick(P.dots); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function drawImageCover(canvas, img) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const s = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const w = img.naturalWidth * s, h = img.naturalHeight * s;
  ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
}

window.compose = async function compose({ backdrop, png }) {
  const bg = document.getElementById('bg');
  const wall = document.getElementById('wall');
  const fg = document.getElementById('fg');
  const dpr = window.devicePixelRatio || 1;

  bg.style.background = '';
  wall.width = Math.round(innerWidth * dpr);
  wall.height = Math.round(innerHeight * dpr);
  wall.getContext('2d').clearRect(0, 0, wall.width, wall.height);

  if (backdrop.kind === 'wallpaper') {
    drawWallpaper(wall, backdrop.name);
  } else if (backdrop.kind === 'image') {
    const im = new Image();
    im.src = backdrop.url;
    await im.decode();
    drawImageCover(wall, im);
  } else {
    bg.style.background = backdrop.css;
    if (!bg.style.background) throw new Error(`invalid CSS backdrop: ${backdrop.css}`);
  }

  fg.src = png;
  await fg.decode();
  return { dpr, css: [innerWidth, innerHeight], natural: [fg.naturalWidth, fg.naturalHeight] };
};
</script>
</body>
</html>
