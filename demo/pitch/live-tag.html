<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Processing sped up tag</title>
<!--
  OBS overlay: add a Browser source pointing at this file (Local file), 1920x1080, and leave the background transparent.
  Show it only over the cut where the processing wait was shortened.
  Options (query string): ?pos=br|bl|tr|tl (corner, default br)  ?text=...  (default "Processing sped up")  ?bg=1 (dark page, for previewing)
-->
<style>
  :root { --panel: #201F1E; --glass: #33322F; --ink: #F3F2EE; --ink2: #A8A49C; --amber: #F0A73A; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body.bg { background: #171716; }
  .tag {
    position: fixed; display: inline-flex; align-items: center; gap: 14px; padding: 14px 22px 14px 18px;
    border-radius: 999px; background: rgba(32, 31, 30, .92); border: 1.5px solid var(--glass);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    font: 600 26px/1 "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: var(--ink); letter-spacing: .01em;
    animation: in .35s cubic-bezier(.2, .7, .2, 1) both;
  }
  .tag svg { width: 30px; height: 30px; flex: none; }
  .br { right: 40px; bottom: 40px; } .bl { left: 40px; bottom: 40px; } .tr { right: 40px; top: 40px; } .tl { left: 40px; top: 40px; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>
<div class="tag br" id="tag">
  <svg viewBox="0 0 30 30" aria-hidden="true"><path d="M4 7 L14 15 L4 23 Z M15 7 L25 15 L15 23 Z" fill="#F0A73A"/></svg>
  <span id="label">Processing sped up</span>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const tag = document.getElementById('tag');
  if (/^(br|bl|tr|tl)$/.test(q.get('pos') || '')) tag.className = 'tag ' + q.get('pos');
  if (q.get('text')) document.getElementById('label').textContent = q.get('text');
  if (q.has('bg')) document.body.classList.add('bg');
</script>
</body>
</html>
