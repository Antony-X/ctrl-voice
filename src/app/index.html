<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:;" />
  <title>Ctrl+Voice</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="win-drag"></div>
  <div class="win-controls">
    <button data-action="win-min" title="Minimize" aria-label="Minimize">&#xE921;</button>
    <button data-action="win-max" title="Maximize" aria-label="Maximize" id="maxBtn">&#xE922;</button>
    <button data-action="win-close" class="close" title="Close to tray" aria-label="Close">&#xE8BB;</button>
  </div>

  <aside class="side glass">
    <div class="brand"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect x="3.5" y="3.5" width="93" height="93" rx="22" stroke-width="7"/><path d="M22.6 40.5v19M36.1 30v40M50 18.5v63M63.9 31v38M77.4 41v18" stroke-width="6"/></svg>Ctrl+Voice</div>
    <button class="record" id="recordBtn" data-action="rec-toggle"></button>
    <nav class="list" id="list" aria-label="Messages"></nav>
    <button class="side-settings" id="settingsBtn" data-action="go-settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      Settings
    </button>
  </aside>

  <main class="main" id="main"></main>

  <div class="pop glass" id="pop" hidden></div>
  <div class="menu glass" id="menu" hidden></div>
  <div class="toast glass" id="toast" hidden></div>

  <script src="../shared/edits.js"></script>
  <script src="app.js"></script>
</body>
</html>
